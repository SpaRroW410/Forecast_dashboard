# CI for the hosted Shiny app at the repository root (NOT the forecastsuite
# package, which has its own workflow). On every change to the app it:
#   1. installs the app's packages on Linux from ONE dated Posit Package
#      Manager snapshot, and runs the app's tests, including a headless-browser
#      smoke test of the full demo flow (tests/testthat/);
#   2. only if the tests pass, regenerates manifest.json with
#      generate_manifest.R (which refuses to write a manifest whose versions
#      aren't all current in that snapshot) and commits it back if it changed.
# Posit Connect Cloud deploys from manifest.json, so it is always produced
# here, on Linux, with a supported R version -- never hand-edited.
name: Hosted app CI

on:
  workflow_dispatch:
  push:
    paths:
      - "app.R"
      - "helpers/**"
      - "server/**"
      - "ui/**"
      - "module/**"
      - "www/**"
      - "data/**"
      - "tests/**"
      - "generate_manifest.R"
      - ".rscignore"
      - ".github/workflows/hosted-app.yaml"
  pull_request:
    paths:
      - "app.R"
      - "helpers/**"
      - "server/**"
      - "ui/**"
      - "module/**"
      - "www/**"
      - "data/**"
      - "tests/**"
      - "generate_manifest.R"
      - ".rscignore"
      - ".github/workflows/hosted-app.yaml"

permissions:
  contents: read

concurrency:
  group: hosted-app-${{ github.ref }}
  cancel-in-progress: true

env:
  # One dated snapshot for every package. Bump deliberately; generate_manifest.R
  # reads the same variable.
  P3M_SNAPSHOT: "2026-11-03"
  P3M_DISTRO: "noble"
  # Connect Cloud documents R 4.0.0-4.6.0; 4.5 has the longest-established
  # binary coverage.
  R_VERSION: "4.5"
  NOT_CRAN: "true"

jobs:
  test:
    name: Tests (Linux, headless smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-r${{ env.R_VERSION }}-${{ env.P3M_SNAPSHOT }}-${{ hashFiles('app.R') }}
          restore-keys: rlib-${{ runner.os }}-r${{ env.R_VERSION }}-${{ env.P3M_SNAPSHOT }}-

      - name: Install app and test packages from the snapshot
        shell: Rscript {0}
        run: |
          repo <- sprintf("https://packagemanager.posit.co/cran/__linux__/%s/%s",
                          Sys.getenv("P3M_DISTRO"), Sys.getenv("P3M_SNAPSHOT"))
          options(repos = c(CRAN = repo), Ncpus = 4L,
                  HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
                    paste(getRversion(), R.version$platform, R.version$arch, R.version$os)))
          app <- readLines("app.R")
          pkgs <- unique(sub(".*library\\(([A-Za-z0-9.]+)\\).*", "\\1",
                             grep("^\\s*library\\([A-Za-z0-9.]+\\)", app, value = TRUE)))
          need <- setdiff(c(pkgs, "testthat", "shinytest2", "withr", "rsconnect"),
                          rownames(installed.packages()))
          if (length(need)) install.packages(need)
          old <- old.packages()
          if (!is.null(old)) install.packages(rownames(old))
          sessionInfo()

      - name: Run hosted-app tests (helpers + headless smoke test)
        working-directory: tests
        run: Rscript testthat.R

  manifest:
    name: Regenerate manifest.json
    needs: test
    # Only for pushes in this repository; PRs just get the tests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Restore R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-r${{ env.R_VERSION }}-${{ env.P3M_SNAPSHOT }}-${{ hashFiles('app.R') }}
          restore-keys: rlib-${{ runner.os }}-r${{ env.R_VERSION }}-${{ env.P3M_SNAPSHOT }}-

      - name: Generate and verify manifest.json
        run: Rscript generate_manifest.R --install

      - name: Commit manifest.json if it changed
        run: |
          if git diff --quiet -- manifest.json; then
            echo "manifest.json unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Regenerate manifest.json (CI: R $(Rscript -e 'cat(as.character(getRversion()))'), P3M snapshot ${P3M_SNAPSHOT})"
          git push
